function blurCh(a,w,h,r){r=Math.round(r);if(r<1)return a;const k=2*r+1,t=new Float32Array(a.length),o=new Float32Array(a.length);
 for(let y=0;y<h;y++){const row=y*w;let s=0;for(let i=-r;i<=r;i++)s+=a[row+Math.min(w-1,Math.max(0,i))];for(let x=0;x<w;x++){t[row+x]=s/k;s+=a[row+Math.min(w-1,x+r+1)]-a[row+Math.max(0,x-r)]}}
 for(let x=0;x<w;x++){let s=0;for(let i=-r;i<=r;i++)s+=t[Math.min(h-1,Math.max(0,i))*w+x];for(let y=0;y<h;y++){o[y*w+x]=s/k;s+=t[Math.min(h-1,y+r+1)*w+x]-t[Math.max(0,y-r)*w+x]}}
 return o}
const gauss=(a,w,h,r)=>blurCh(blurCh(a,w,h,r),w,h,r);
function lumOf(R,G,B){const L=new Float32Array(R.length);for(let i=0;i<L.length;i++)L[i]=.299*R[i]+.587*G[i]+.114*B[i];return L}
function sobel(L,w,h){const M=new Float32Array(L.length);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;
 const gx=-L[i-w-1]-2*L[i-1]-L[i+w-1]+L[i-w+1]+2*L[i+1]+L[i+w+1],gy=-L[i-w-1]-2*L[i-w]-L[i-w+1]+L[i+w-1]+2*L[i+w]+L[i+w+1];M[i]=Math.sqrt(gx*gx+gy*gy)}return M}
function pct(M,p){const s=[];for(let i=0;i<M.length;i+=7)s.push(M[i]);s.sort((a,b)=>a-b);return s[Math.floor(p*(s.length-1))]||1}
function edgeA(M,thr,soft){const A=new Float32Array(M.length),k=1/(thr*soft);for(let i=0;i<M.length;i++){const v=(M[i]-thr)*k;A[i]=v<0?0:v>1?1:v}return A}
function dilate(A,w,h){const O=new Float32Array(A.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let m=A[y*w+x];
 if(x>0&&A[y*w+x-1]>m)m=A[y*w+x-1];if(x<w-1&&A[y*w+x+1]>m)m=A[y*w+x+1];if(y>0&&A[(y-1)*w+x]>m)m=A[(y-1)*w+x];if(y<h-1&&A[(y+1)*w+x]>m)m=A[(y+1)*w+x];O[y*w+x]=m}return O}
function inkEdges(R,G,B,w,h,p,soft,thick){let L=gauss(lumOf(R,G,B),w,h,Math.max(1,Math.round(w/420)));let A=edgeA(sobel(L,w,h),pct(sobel(L,w,h),p),soft);for(let i=0;i<thick;i++)A=dilate(A,w,h);return A}
function halftone(x,y,cell,cov){if(cov<=0)return 0;const u=(x+y)*.7071/cell,v=(x-y)*.7071/cell,fu=u-Math.floor(u)-.5,fv=v-Math.floor(v)-.5,d=Math.sqrt(fu*fu+fv*fv),r=Math.sqrt(Math.min(cov,1)/Math.PI)*1.08;const a=(r-d)*cell;return a<0?0:a>1?1:a}
function valueNoise(w,h,cell,seed){const gw=Math.ceil(w/cell)+2,gh=Math.ceil(h/cell)+2,g=new Float32Array(gw*gh);let s=seed||7;for(let i=0;i<g.length;i++){s=(s*16807)%2147483647;g[i]=s/2147483647*2-1}
 const N=new Float32Array(w*h);for(let y=0;y<h;y++){const gy=y/cell,y0=Math.floor(gy),fy=gy-y0;for(let x=0;x<w;x++){const gx=x/cell,x0=Math.floor(gx),fx=gx-x0,i=y0*gw+x0;
 const a=g[i]+(g[i+1]-g[i])*fx,b=g[i+gw]+(g[i+gw+1]-g[i+gw])*fx;N[y*w+x]=a+(b-a)*fy}}return N}
const clamp=v=>v<0?0:v>255?255:v;

const FX={
 anim(R,G,B,w,h){const r=Math.max(1,Math.round(w/260));const Rs=gauss(gauss(R,w,h,r),w,h,r),Gs=gauss(gauss(G,w,h,r),w,h,r),Bs=gauss(gauss(B,w,h,r),w,h,r);
  const L=lumOf(Rs,Gs,Bs),A=inkEdges(R,G,B,w,h,.9,.7,w>650?2:1),O=new Uint8ClampedArray(w*h*4),lv=5;
  for(let i=0,j=0;i<L.length;i++,j+=4){const l=L[i],q=(Math.min(lv-1,Math.floor(l/256*lv))+.5)/lv*255,f=(0.72*q+0.28*l+10)/(l+1);
   let r_=Rs[i]*f,g_=Gs[i]*f,b_=Bs[i]*f;const gl=.299*r_+.587*g_+.114*b_;r_=gl+(r_-gl)*1.4;g_=gl+(g_-gl)*1.4;b_=gl+(b_-gl)*1.4;const a=A[i];
   O[j]=clamp(r_*(1-a)+28*a);O[j+1]=clamp(g_*(1-a)+24*a);O[j+2]=clamp(b_*(1-a)+30*a);O[j+3]=255}return O},
 manga(R,G,B,w,h){let L=gauss(lumOf(R,G,B),w,h,1);const lo=pct(L,.03),hi=pct(L,.97),A=inkEdges(R,G,B,w,h,.87,.6,w>650?1:0),O=new Uint8ClampedArray(w*h*4),cell=Math.max(5,w/105);
  for(let y=0,i=0;y<h;y++)for(let x=0;x<w;x++,i++){let v=(L[i]-lo)/(hi-lo+1)*255;let o;
   if(v>205)o=252;else if(v<48)o=20;else{const cov=Math.pow((205-v)/157,1.1);const a=halftone(x,y,cell,cov);o=252*(1-a)+22*a}
   const a=A[i];o=o*(1-a)+14*a;const j=i*4;O[j]=o;O[j+1]=o-1;O[j+2]=o-5;O[j+3]=255}return O},
 pop(R,G,B,w,h){const r=Math.max(1,Math.round(w/420));const Rs=gauss(R,w,h,r),Gs=gauss(G,w,h,r),Bs=gauss(B,w,h,r);const A=inkEdges(R,G,B,w,h,.88,.6,w>650?2:1),O=new Uint8ClampedArray(w*h*4),cell=Math.max(6,w/80);
  for(let y=0,i=0;y<h;y++)for(let x=0;x<w;x++,i++){let r_=Rs[i],g_=Gs[i],b_=Bs[i];const gl=.299*r_+.587*g_+.114*b_;r_=gl+(r_-gl)*1.9;g_=gl+(g_-gl)*1.9;b_=gl+(b_-gl)*1.9;
   r_=Math.round(clamp(r_)/255*3)*85;g_=Math.round(clamp(g_)/255*3)*85;b_=Math.round(clamp(b_)/255*3)*85;
   const cov=Math.max(0,(175-gl)/175)*.85,d=halftone(x,y,cell,cov)*.62;r_*=1-d;g_*=1-d;b_*=1-d;
   if(gl>150){const hd=halftone(x+cell/2,y,cell,(gl-150)/105*.35)*.18;b_=b_*(1-hd);g_=g_*(1-hd*.4)}
   const a=A[i],j=i*4;O[j]=clamp(r_*(1-a)+12*a);O[j+1]=clamp(g_*(1-a)+12*a);O[j+2]=clamp(b_*(1-a)+16*a);O[j+3]=255}return O},
 aqua(R,G,B,w,h){const r=Math.max(1,Math.round(w/320));const Rs=gauss(gauss(R,w,h,r),w,h,r),Gs=gauss(gauss(G,w,h,r),w,h,r),Bs=gauss(gauss(B,w,h,r),w,h,r);
  const L=lumOf(Rs,Gs,Bs),L2=gauss(L,w,h,r*3),N=valueNoise(w,h,Math.max(14,w/40),11),N2=valueNoise(w,h,Math.max(40,w/8),5);
  const A=inkEdges(R,G,B,w,h,.9,.8,0),O=new Uint8ClampedArray(w*h*4),lv=7,m=Math.min(w,h)*.045;
  for(let y=0,i=0;y<h;y++)for(let x=0;x<w;x++,i++){const l=L[i],q=(Math.min(lv-1,Math.floor(l/256*lv))+.5)/lv*255,f=(.5*q+.5*l)/(l+1);
   let r_=Rs[i]*f,g_=Gs[i]*f,b_=Bs[i]*f;const gl=.299*r_+.587*g_+.114*b_;r_=gl+(r_-gl)*1.2;g_=gl+(g_-gl)*1.2;b_=gl+(b_-gl)*1.2;
   const pool=1-Math.min(.22,Math.abs(l-L2[i])/255*1.3),tex=1+N[i]*.05+(Math.random()-.5)*.03;
   r_=(r_*.88+255*.12)*pool*tex;g_=(g_*.88+250*.12)*pool*tex;b_=(b_*.88+238*.12)*pool*tex;
   const bd=Math.min(x,y,w-1-x,h-1-y)/m+N2[i]*.35;if(bd<1){const k=Math.max(0,bd);r_=r_*k+251*(1-k);g_=g_*k+247*(1-k);b_=b_*k+238*(1-k)}
   const a=A[i]*.5,j=i*4;O[j]=clamp(r_*(1-a)+70*a);O[j+1]=clamp(g_*(1-a)+60*a);O[j+2]=clamp(b_*(1-a)+55*a);O[j+3]=255}return O},
 cine(R,G,B,w,h){const O=new Uint8ClampedArray(w*h*4),y0=1/(1+Math.exp(3)),y1=1/(1+Math.exp(-3)),curve=v=>{const x=v/255,c=(1/(1+Math.exp(-6*(x-.5)))-y0)/(y1-y0);return(.62*c+.38*x)*255};
  for(let y=0,i=0;y<h;y++)for(let x=0;x<w;x++,i++){let r_=curve(R[i]),g_=curve(G[i]),b_=curve(B[i]);const l=(.299*r_+.587*g_+.114*b_)/255,s=(1-l)*(1-l),hh=l*l;
   r_+=-12*s+20*hh;g_+=3*s+6*hh;b_+=16*s-16*hh;const gl=.299*r_+.587*g_+.114*b_;r_=gl+(r_-gl)*1.08;g_=gl+(g_-gl)*1.08;b_=gl+(b_-gl)*1.08;
   const dx=x/w-.5,dy=y/h-.5,v=1-.9*(dx*dx+dy*dy),gr=(Math.random()-.5)*12,j=i*4;O[j]=clamp(r_*v+gr);O[j+1]=clamp(g_*v+gr);O[j+2]=clamp(b_*v+gr);O[j+3]=255}return O}};

/* découpe "cover" d'une photo dans un cadre w×h (zoom + centre) */
function cropTo(src,w,h,zoom=1,cx=.5,cy=.45){const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");
 const iw=src.width,ih=src.height,a=w/h;let sw=Math.min(iw,ih*a)/zoom,sh=sw/a;let sx=Math.min(Math.max(cx*iw-sw/2,0),iw-sw),sy=Math.min(Math.max(cy*ih-sh/2,0),ih-sh);
 ctx.imageSmoothingQuality="high";ctx.drawImage(src,sx,sy,sw,sh,0,0,w,h);return c}
const CACHE=new Map();
function stylize(photo,style,w,h,zoom,cx,cy){w=Math.round(w);h=Math.round(h);const key=[photo.id,style,w,h,zoom,cx,cy].join("|");if(CACHE.has(key))return CACHE.get(key);
 const c=cropTo(photo.src,w,h,zoom,cx,cy),ctx=c.getContext("2d"),id=ctx.getImageData(0,0,w,h),[R,G,B]=chans(id);id.data.set(FX[style](R,G,B,w,h));ctx.putImageData(id,0,0);
 if(CACHE.size>220)CACHE.delete(CACHE.keys().next().value);CACHE.set(key,c);return c}

/* ============================== TEXTE & BULLES ============================== */
const F=(tpl,s)=>tpl.replace("{s}",Math.round(s));
function wrap(ctx,text,maxW){const out=[];String(text).split("\n").forEach(par=>{let line="";par.split(/\s+/).forEach(w=>{const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});out.push(line)});return out}
function heroes(){const h=ST.story.heroes.map(x=>x.trim()).filter(Boolean);return h.length?h:["Elle","Lui"]}
function fill(t){const h=heroes();const tous=h.length==1?h[0]:h.slice(0,-1).join(", ")+" & "+h[h.length-1];
 return String(t).replace(/\{A\}/g,h[0]).replace(/\{B\}/g,h[1]||h[0]).replace(/\{C\}/g,h[2]||h[1]||h[0]).replace(/\{tous\}/g,tous).replace(/\{occasion\}/g,ST.story.occasion.toLowerCase())}
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}

function drawCaption(ctx,S,x,y,maxW,when,text,fs){const parts=[];ctx.font=F(S.capFont,fs);const lines=text?wrap(ctx,text,maxW-2*fs*.6):[];
 const lh=fs*1.22,pad=fs*.55;let wl=[];if(when){ctx.font=F(S.capFont.replace(/^(italic )?\d+ /,"italic 600 "),fs*.82);wl=wrap(ctx,when,maxW-2*pad)}
 ctx.font=F(S.capFont,fs);let bw=0;lines.forEach(l=>bw=Math.max(bw,ctx.measureText(l).width));ctx.font=F(S.capFont.replace(/^(italic )?\d+ /,"italic 600 "),fs*.82);wl.forEach(l=>bw=Math.max(bw,ctx.measureText(l).width));
 bw+=2*pad;const bh=pad*2+lines.length*lh+wl.length*lh*.85;ctx.fillStyle=S.capBg;ctx.fillRect(x,y,bw,bh);if(S.id!="cine"){ctx.lineWidth=3;ctx.strokeStyle=S.frame;ctx.strokeRect(x,y,bw,bh)}
 ctx.fillStyle=S.capFg;ctx.textBaseline="top";let yy=y+pad;ctx.globalAlpha=.75;wl.forEach(l=>{ctx.fillText(l,x+pad,yy);yy+=lh*.85});ctx.globalAlpha=1;ctx.font=F(S.capFont,fs);lines.forEach(l=>{ctx.fillText(l,x+pad,yy);yy+=lh});return bh}
function drawBubble(ctx,S,px,py,pw,ph,text,side,fs){fs*=S.bubScale||1;ctx.font=F(S.bubFont,fs);const lines=wrap(ctx,text,pw*.5);const lh=fs*1.18;let tw=0;lines.forEach(l=>tw=Math.max(tw,ctx.measureText(l).width));
 const rx=Math.min(pw*.46,tw/2*1.25+fs*.6),ry=lines.length*lh/2*1.28+fs*.5;const m=pw*.05;
 const cx=side?px+pw-m-rx:px+m+rx,cy=py+ph-Math.max(ph*.2,ry*2+ph*.05)+ry*.1;
 const tx=cx+(side?-1:1)*rx*.35,ty=Math.min(py+ph-6,cy+ry+Math.max(28,ph*.12));
 ctx.lineJoin="round";ctx.lineWidth=S.id=="cine"?3:6;ctx.strokeStyle=S.id=="cine"?"#000":S.frame;ctx.fillStyle="#fff";
 const tail=()=>{ctx.beginPath();ctx.moveTo(cx+(side?-1:1)*rx*.05,cy+ry*.6);ctx.quadraticCurveTo(cx+(side?-1:1)*rx*.15,cy+ry*1.1,tx,ty);ctx.quadraticCurveTo(cx+(side?-1:1)*rx*.3,cy+ry*.9,cx+(side?-1:1)*rx*.4,cy+ry*.5);ctx.closePath()};
 const ell=()=>{ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2)};
 tail();ctx.stroke();ell();ctx.stroke();tail();ctx.fill();ell();ctx.fill();
 ctx.fillStyle="#141414";ctx.textAlign="center";ctx.textBaseline="middle";lines.forEach((l,k)=>ctx.fillText(l,cx,cy+(k-(lines.length-1)/2)*lh));ctx.textAlign="left"}
function textCard(ctx,S,x,y,w,h,text,big){ctx.fillStyle=S.card;ctx.fillRect(x,y,w,h);let fs=Math.min(h*.28,w*.11)*(big?1.4:1);ctx.font=F(S.titleFont,fs);let lines=wrap(ctx,text,w*.84);
 while(lines.length*fs*1.1>h*.8&&fs>18){fs*=.9;ctx.font=F(S.titleFont,fs);lines=wrap(ctx,text,w*.84)}
 ctx.fillStyle=S.cardFg;ctx.textAlign="center";ctx.textBaseline="middle";lines.forEach((l,k)=>ctx.fillText(l,x+w/2,y+h/2+(k-(lines.length-1)/2)*fs*1.1));ctx.textAlign="left"}
function outlinedText(ctx,S,text,x,y,fs,maxW,color,stroke){ctx.font=F(S.titleFont,fs);let lines=wrap(ctx,text,maxW);while(lines.length>3&&fs>40){fs*=.9;ctx.font=F(S.titleFont,fs);lines=wrap(ctx,text,maxW)}
 ctx.textAlign="center";ctx.textBaseline="top";ctx.lineJoin="round";lines.forEach((l,k)=>{const yy=y+k*fs*1.05;if(stroke){ctx.lineWidth=fs*.14;ctx.strokeStyle=stroke;ctx.strokeText(l,x,yy)}ctx.fillStyle=color;ctx.fillText(l,x,yy)});ctx.textAlign="left";return lines.length*fs*1.05}

/* ============================== MISE EN PAGE ============================== */
const PW=1240,PH=1754,MG=58,GT=22;
const TPL={A:[[0,0,1,.55],[0,.55,.5,.45],[.5,.55,.5,.45]],B:[[0,0,.5,.45],[.5,0,.5,.45],[0,.45,1,.55]],C:[[0,0,1,.333],[0,.333,1,.334],[0,.667,1,.333]],
 D:[[0,0,.5,.5],[.5,0,.5,.5],[0,.5,.5,.5],[.5,.5,.5,.5]],E:[[0,0,.58,1],[.58,0,.42,.5],[.58,.5,.42,.5]],F:[[0,0,1,.4],[0,.4,.42,.6],[.42,.4,.58,.6]],
 G:[[0,0,.6,.34],[.6,0,.4,.34],[0,.34,1,.33],[0,.67,.4,.33],[.4,.67,.6,.33]],H:[[0,0,.5,.333],[.5,0,.5,.333],[0,.333,.5,.334],[.5,.333,.5,.334],[0,.667,.5,.333],[.5,.667,.5,.333]],
 END:[[0,0,1,.72],[0,.72,1,.28]]};
const DENSER={A:"D",B:"D",C:"D",E:"D",F:"D",D:"G",G:"H",H:"H"};
function buildPlan(){const P=ST.photos,n=P.length,L=LENGTHS.find(l=>l.id==ST.length),N=L.pages,r=rng(ST.seed);
 const pool=["A","B","C","D","E","F","B","A","E","D"];const tp=[];for(let i=0;i<N-1;i++)tp.push(i==0?"A":pool[Math.floor(r()*pool.length)]);
 const need=Math.max(0,n-1);let tot=()=>tp.reduce((s,t)=>s+TPL[t].length,0);let guard=0;while(tot()<need&&guard++<100){let k=0;tp.forEach((t,i)=>{if(TPL[t].length<TPL[tp[k]].length)k=i});if(tp[k]=="H")break;tp[k]=DENSER[tp[k]]}
 const slots=tot(),extra=Math.max(0,slots-need),nCh=Math.min(n>3?5:2,Math.floor(extra/4)),nCl=extra-nCh;
 const tone=ST.story.tone,chs=CHAPS[tone];const seq=[];const closeSpots=[[.5,.38],[.32,.5],[.68,.5],[.5,.62]];
 const per=[];for(let i=0;i<need;i++)per.push(0);for(let k=0;k<nCl;k++)per[k%Math.max(need,1)]++;
 for(let i=0;i<need;i++){seq.push({kind:"photo",pi:i});for(let k=0;k<per[i];k++){const sp=closeSpots[(i+k)%4];seq.push({kind:"close",pi:i,zoom:1.6+0.25*(k%3),cx:sp[0],cy:sp[1],txt:r()<.3?SILENT[Math.floor(r()*SILENT.length)]:""})}}
 for(let c=0;c<nCh;c++){const pos=Math.round((c+1)*seq.length/(nCh+1));let p=pos;while(p<seq.length&&seq[p].kind!="photo")p++;seq.splice(Math.max(1,p),0,{kind:"chap",txt:chs[(c+ST.seed)%chs.length]})}
 while(seq.length<slots)seq.push({kind:"chap",txt:chs[seq.length%chs.length]});
 const pages=[];let k=0;tp.forEach(t=>{pages.push({tpl:t,items:TPL[t].map(()=>seq[k++])})});pages.push({tpl:"END",items:[{kind:"photo",pi:n-1,last:1},{kind:"fin"}]});return pages}
function panelRect(r){const ax=MG-GT/2,ay=MG-GT/2,aw=PW-2*MG+GT,ah=PH-2*MG-34+GT;return[ax+r[0]*aw+GT/2,ay+r[1]*ah+GT/2,r[2]*aw-GT,r[3]*ah-GT]}
async function renderPage(pg,num){const S=STYLES.find(s=>s.id==ST.style),c=document.createElement("canvas");c.width=PW;c.height=PH;const ctx=c.getContext("2d");
 ctx.fillStyle=S.page;ctx.fillRect(0,0,PW,PH);const sp=heroes();
 for(let i=0;i<pg.items.length;i++){const it=pg.items[i];const [x,y,w,h]=panelRect(TPL[pg.tpl][i]);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  const fs=Math.max(24,Math.min(36,w/19));
  if(it.kind=="photo"||it.kind=="close"){const ph=ST.photos[it.pi];ctx.drawImage(stylize(ph,ST.style,w,h,it.zoom||1,it.cx||.5,it.cy||.45),x,y);await tick();
   if(it.kind=="photo"){if(ph.when||ph.caption)drawCaption(ctx,S,x,y,Math.min(w*.72,560),ph.when,ph.caption,fs);if(ph.bubble)drawBubble(ctx,S,x,y,w,h,ph.bubble,ph.speaker%2==1,fs)}
   else if(it.txt)drawCaption(ctx,S,x,y,w*.7,"",it.txt,fs)}
  else if(it.kind=="chap")textCard(ctx,S,x,y,w,h,it.txt);
  else if(it.kind=="fin"){ctx.fillStyle=S.card;ctx.fillRect(x,y,w,h);ctx.fillStyle=S.cardFg;ctx.font=F(S.titleFont,Math.min(110,h*.42));ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText(S.id=="aqua"||S.id=="cine"?"Fin":"FIN",x+w/2,y+h*.08);
   if(ST.story.dedicace){ctx.font="600 "+Math.round(Math.min(58,h*.17))+"px Caveat, cursive";const ls=wrap(ctx,ST.story.dedicace,w*.86);ls.slice(0,3).forEach((l,k)=>ctx.fillText(l,x+w/2,y+h*.52+k*h*.15))}ctx.textAlign="left"}
  ctx.restore();ctx.lineWidth=S.id=="cine"?0:5;if(ctx.lineWidth){ctx.strokeStyle=S.frame;ctx.strokeRect(x,y,w,h)}}
 ctx.fillStyle=S.pageNum||"#777";ctx.font="500 20px Inter, sans-serif";ctx.textAlign="center";ctx.fillText(String(num),PW/2,PH-36);ctx.textAlign="left";return c}
async function renderCover(){const S=STYLES.find(s=>s.id==ST.style),c=document.createElement("canvas");c.width=PW;c.height=PH;const ctx=c.getContext("2d");

 </div>${navbar("style","apercu","Voir ma BD")}`}

/* ---------- 5. Aperçu ---------- */
function apercu(){$("#app").innerHTML=`<div class="wrap"><div class="page-h row" style="justify-content:space-between"><div><h2>📖 Votre BD</h2><div class="mut">${esc(fill(ST.story.title||TITLES[ST.story.type][0]))} · ${STYLES.find(s=>s.id==ST.style).t} · ${LENGTHS.find(l=>l.id==ST.length).pages} planches</div></div>
 <div class="row"><button class="sm ghost" onclick="ST.seed++;markDirty();apercu()">🎲 Autre mise en page</button><button class="sm ghost" onclick="go('histoire')">✏️ Textes</button><button class="sm ghost" onclick="go('style')">🎨 Style</button></div></div>
 <div class="viewer"><div class="pagebox" id="pbox"></div><div class="tstrip" id="tstrip"></div></div>
 </div>${navbar("longueur","commande","Commander / offrir")}`;
 if(ST.dirty||!ST.pages.length){ST.pageIdx=0;renderAll()}drawViewer()}
function drawViewer(){const b=$("#pbox");if(!b)return;const total=LENGTHS.find(l=>l.id==ST.length).pages+1,i=ST.pageIdx,src=ST.pages[i];
 b.innerHTML=src?`<img src="${src}" alt="planche"><div class="row"><button onclick="flip(-1)" ${i==0?"disabled":""}>←</button><span>${i==0?"Couverture":"Planche "+i} · ${i+1}/${total}</span><button onclick="flip(1)" ${i>=total-1?"disabled":""}>→</button><button class="sm" onclick="dlPage()">⬇️ PNG</button></div>`
 :`<div style="height:60vh;display:grid;place-items:center;text-align:center;color:#fff"><div><div style="font-size:50px">✏️</div><div id="progt" style="margin:10px 0">Nos dessinateurs s'activent…</div><div class="progress" id="prog" style="margin:auto"><i></i></div></div></div>`;
 if(ST.rendering&&src)b.insertAdjacentHTML("beforeend",`<div style="color:#fff;font-size:14px;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px"><span id="progt"></span><div class="progress" id="prog"><i style="width:${Math.round(100*ST.pages.length/total)}%"></i></div></div>`);
 $("#tstrip").innerHTML=Array.from({length:total},(_,k)=>ST.pages[k]?`<img src="${ST.pages[k]}" class="${k==i?"on":""}" onclick="ST.pageIdx=${k};drawViewer()">`:`<div style="aspect-ratio:1240/1754;background:#e8dfd2;border-radius:4px"></div>`).join("")}
function flip(d){const total=LENGTHS.find(l=>l.id==ST.length).pages+1;ST.pageIdx=Math.max(0,Math.min(total-1,ST.pageIdx+d));drawViewer()}
document.addEventListener("keydown",e=>{if(ST.step!="apercu")return;if(e.key=="ArrowRight")flip(1);if(e.key=="ArrowLeft")flip(-1)});
function dlPage(){const a=document.createElement("a");a.href=ST.pages[ST.pageIdx];a.download=`ma-bd-${ST.pageIdx==0?"couverture":"planche-"+ST.pageIdx}.jpg`;a.click()}
async function dlPDF(){if(ST.dirty||ST.pages.length<LENGTHS.find(l=>l.id==ST.length).pages+1){toast("Préparation de la BD…");await renderAll()}
 if(!window.jspdf)return toast("Le module PDF n'a pas pu se charger (connexion ?). Téléchargez les planches une par une depuis l'aperçu.");
 const doc=new window.jspdf.jsPDF({unit:"px",format:[PW,PH],hotfixes:["px_scaling"]});ST.pages.forEach((p,k)=>{if(k)doc.addPage([PW,PH]);doc.addImage(p,"JPEG",0,0,PW,PH)});doc.save("ma-bd-il-etait-une-fois.pdf")}

/* ---------- 6. Commande ---------- */
function price(){const o=ST.order,f=FORMATS.find(x=>x.id==o.format),L=LENGTHS.find(l=>l.id==ST.length),isPrint=f.id!="pdf";
 const unit=f.p+L.add*(isPrint?1:.5),lines=[[`${f.t} · ${L.t}`,unit]];if(o.qty>1)lines.push([`${o.qty-1} exemplaire(s) en plus (−40 %)`,(o.qty-1)*unit*.6]);
 EXTRAS.forEach(e=>{if(o.extras[e.id]&&(!e.print||isPrint)&&e.notIn!=f.id)lines.push([e.t.replace(/^\S+ /,""),e.p*(e.id=="mug"?o.qty:1)])});
 if(isPrint){const s=SHIPPING.find(x=>x.id==o.ship);lines.push(["Livraison "+s.t.split(" ")[0].toLowerCase(),s.p])}
 return{lines,total:lines.reduce((a,l)=>a+l[1],0),isPrint}}
function delivery(){const o=ST.order,s=SHIPPING.find(x=>x.id==o.ship),d=new Date();let n=2+s.days;while(n>0){d.setDate(d.getDate()+1);if(d.getDay()%6)n--}return d}
function commande(){const o=ST.order,f=FORMATS.find(x=>x.id==o.format),pr=price(),dl=delivery(),x=new Date(new Date().getFullYear(),11,24),ok=dl<=x;
 $("#app").innerHTML=`<div class="wrap"><div class="page-h"><h2>🎁 Impression & cadeau</h2><div class="mut">Choisissez comment offrir votre BD.</div></div>
 <div class="shop"><div>
  <div class="grid g2">${FORMATS.map(x=>`<div class="card opt ${o.format==x.id?"on":""}" onclick="ST.order.format='${x.id}';commande()"><div class="row" style="justify-content:space-between"><div class="big">${x.em}</div>${x.best?`<span class="pill" style="background:var(--gold);color:#fff">Le plus offert</span>`:""}</div><h3 style="margin-top:6px">${x.t}</h3><div class="mut" style="font-size:14px">${x.d}</div><div style="margin-top:8px;font-weight:800;font-size:20px">${eur(x.p+LENGTHS.find(l=>l.id==ST.length).add*(x.id=="pdf"?.5:1))}</div></div>`).join("")}</div>
  ${pr.isPrint?`<h3 style="margin-top:24px">Options</h3>
   ${EXTRAS.filter(e=>e.notIn!=o.format).map(e=>`<label class="check ${o.extras[e.id]?"on":""}"><input type="checkbox" ${o.extras[e.id]?"checked":""} onchange="ST.order.extras['${e.id}']=this.checked;commande()"><div><b>${e.t}</b><div class="mut" style="font-size:14px;font-weight:400">${e.d}</div></div><span class="pr">+ ${eur(e.p)}</span></label>`).join("")}
   <div class="grid g2" style="margin-top:6px"><div><label>Nombre d'exemplaires</label><div class="row" style="flex-wrap:nowrap"><button class="sm" onclick="ST.order.qty=Math.max(1,ST.order.qty-1);commande()">−</button><b style="min-width:30px;text-align:center">${o.qty}</b><button class="sm" onclick="ST.order.qty=Math.min(10,ST.order.qty+1);commande()">+</button><span class="mut" style="font-size:13px">−40 % dès le 2ᵉ (pour les grands-parents !)</span></div></div>
   <div><label>Livraison</label><select onchange="ST.order.ship=this.value;commande()">${SHIPPING.map(s=>`<option value="${s.id}" ${o.ship==s.id?"selected":""}>${s.t} · ${eur(s.p)}</option>`).join("")}</select></div></div>`
   :`<div class="note" style="margin-top:18px">📱 Le PDF HD est livré immédiatement par e-mail, avec un lien de partage pour toute la famille.</div>`}
 </div>
 <div class="summary card"><div class="book3d"><div class="b" style="background-image:url(${ST.pages[0]||""})"></div></div>
  ${pr.isPrint?`<div class="deadline">${ok?"🎄 Livré avant Noël":"⚠️ Livraison après Noël"} · estimé le ${dl.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}${!ok&&o.ship=="std"?" — choisissez l'express !":""}</div>`:`<div class="deadline">⚡ Livraison immédiate par e-mail</div>`}
  ${pr.lines.map(l=>`<div class="l"><span>${esc(l[0])}</span><b>${eur(l[1])}</b></div>`).join("")}<div class="l tot"><span>Total</span><span>${eur(pr.total)}</span></div>
  <button class="pri" style="width:100%;margin-top:14px;font-size:17px" onclick="checkout()">Commander · ${eur(pr.total)}</button>
  <div class="mut" style="font-size:13px;text-align:center;margin-top:8px">🔒 Paiement sécurisé · Satisfait ou réimprimé</div></div></div>
 </div>${navbar("apercu","commande","")}`;$(".navbar #nextBtn").style.visibility="hidden";if(!ST.pages.length&&!ST.rendering)renderAll().then(()=>ST.step=="commande"&&commande())}
function checkout(){const pr=price(),m=document.createElement("div");m.className="modal";m.onclick=e=>{if(e.target==m)m.remove()};
 m.innerHTML=`<div class="card"><h2>Finaliser la commande</h2><div class="note">🧪 Site de démonstration : aucun paiement réel ne sera effectué.</div>
 <label>Prénom et nom</label><input id="ck-n" placeholder="Léa Martin">${pr.isPrint?`<label>Adresse de livraison</label><textarea id="ck-a" placeholder="12 rue des Lilas, 75011 Paris"></textarea>`:""}
 <label>E-mail</label><input id="ck-e" type="email" placeholder="lea@exemple.fr"><label>Carte bancaire</label><input placeholder="4242 4242 4242 4242 · 12/28 · 123">
 <div class="row" style="margin-top:16px;justify-content:space-between"><button class="ghost" onclick="this.closest('.modal').remove()">Annuler</button><button class="pri" onclick="this.closest('.modal').remove();go('merci')">Payer ${eur(pr.total)}</button></div></div>`;document.body.appendChild(m)}
function merci(){const no="BD-"+Math.random().toString(36).slice(2,8).toUpperCase(),pr=price();
 $("#app").innerHTML=`<div class="wrap" style="max-width:720px;text-align:center;padding-top:40px"><div style="font-size:64px">🎉</div><h1>Merci !</h1><p class="lead mut">Votre commande <b>${no}</b> est confirmée (démo).</p>
 <div class="book3d"><div class="b" style="background-image:url(${ST.pages[0]||""});width:240px"></div></div>
 <div class="card" style="text-align:left">${pr.isPrint?`<p>📦 Votre album part à l'impression dans les 48 h. Livraison estimée : <b>${delivery().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</b>.</p>`:""}
 <p>📱 Votre BD numérique est prête :</p><button class="pri" onclick="dlPDF()">⬇️ Télécharger ma BD (PDF)</button></div>
 <div class="row" style="justify-content:center;margin-top:20px"><button class="ghost" onclick="go('apercu')">Revoir ma BD</button><button class="ghost" onclick="ST.photos=[];ST.pages=[];ST.dirty=true;ST.story={type:'couple',heroes:['',''],tone:'tendre',occasion:'Noël',title:'',dedicace:''};go('home')">Créer une autre BD</button></div></div>`;
 setTimeout(confettiX,100)}
function confettiX(){for(let i=0;i<40;i++){const s=document.createElement("div");s.textContent=["🎄","⭐","🎁","💖","✨"][i%5];s.style.cssText=`position:fixed;top:-40px;left:${Math.random()*100}vw;font-size:28px;z-index:99;transition:transform 2.6s linear,opacity 2.6s;pointer-events:none`;document.body.appendChild(s);requestAnimationFrame(()=>{s.style.transform=`translateY(110vh) rotate(${Math.random()*720}deg)`;s.style.opacity=".3"});setTimeout(()=>s.remove(),2800)}}

go("home");
</script>
</body>
</html>
